name: Japanese blueprint Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/blueprint-pages.yml'
      - 'blueprint/**'
      - 'scripts/**'
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  pull_request:
    paths:
      - '.github/workflows/blueprint-pages.yml'
      - 'blueprint/**'
      - 'scripts/**'
      - '**/*.lean'
      - 'lean-toolchain'
      - 'lake-manifest.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: blueprint-pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Verify Lean and build Japanese blueprint
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout full history for pinned source links
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: blueprint/requirements.txt

      - name: Install Japanese PDF and graph tools
        run: |
          sudo apt-get update
          sudo apt-get install --no-install-recommends -y \
            texlive-xetex texlive-lang-cjk texlive-lang-chinese fonts-noto-cjk \
            latexmk graphviz libgraphviz-dev poppler-utils zstd

      - name: Restore pinned Lean and build cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: |
            ${{ runner.temp }}/ginzburg333-tooling/lean-4.19.0-linux
            .lake
          key: lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-${{ hashFiles('**/*.lean') }}
          restore-keys: |
            lean-${{ runner.os }}-${{ hashFiles('lean-toolchain', 'lake-manifest.json') }}-

      - name: Install pinned blueprint packages
        run: python -m pip install -r blueprint/requirements.txt

      - name: Verify all Lean sources and theorem axioms
        env:
          GINZBURG333_TOOLING: ${{ runner.temp }}/ginzburg333-tooling
        run: |
          bash scripts/bootstrap.sh bash scripts/verify.sh
          echo "$GINZBURG333_TOOLING/lean-4.19.0-linux/bin" >> "$GITHUB_PATH"

      - name: Build Japanese PDF and HTML
        run: python scripts/build_blueprint.py

      - name: Check actual Lean declarations and document links
        run: python scripts/check_blueprint.py

      - name: Package project-site URLs and PDF
        run: python scripts/package_blueprint_pages.py

      - name: Upload verification logs
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: blueprint-verification
          path: |
            logs/
            blueprint/verification.json
          retention-days: 14

      - name: Upload checked Pages site
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: .tooling/pages

  deploy:
    name: Deploy Japanese blueprint to GitHub Pages
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Deploy checked Pages artifact
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
