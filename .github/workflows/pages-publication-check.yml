name: Check public blueprint Pages

on:
  workflow_run:
    workflows: ['Japanese blueprint Pages']
    types: [completed]
  push:
    branches: [main]
    paths:
      - '.github/workflows/pages-publication-check.yml'
      - '.github/scripts/check_pages_publication.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: >-
      github.event_name != 'workflow_run' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event != 'pull_request' &&
       github.event.workflow_run.head_branch == 'main')
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout public access checker
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false

      - name: Check published HTML, PDF, MathJax, fonts and WASM
        env:
          EXPECTED_REVISION: ${{ github.event.workflow_run.head_sha }}
        run: python3 .github/scripts/check_pages_publication.py --revision "$EXPECTED_REVISION"

      - name: Upload public access evidence
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: pages-publication
          path: logs/pages_http.json
          retention-days: 14
